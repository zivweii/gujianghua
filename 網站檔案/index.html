<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>顧講話</title>
<meta name="apple-mobile-web-app-title" content="顧講話">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="app.webmanifest">
<style>
  :root{
    --bg:#FAF8F4; --card:#FFFFFF; --ink:#2B2B2B; --soft:#8A857C;
    --accent:#3E7C6B; --line:#ECE8E1; --ok:#3E7C6B; --retry:#B07A2E;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none}
  body{overflow:hidden}
  button{font:inherit;border:0;background:var(--card);color:var(--ink);border-radius:20px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.3}
  button svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hidden{display:none!important}

  /* ===== 主頁 ===== */
  #themeView,#homeView{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  .homeTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 4px 20px}
  .brand{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700}
  .brand img{width:48px;height:48px;border-radius:12px}
  .order{flex-direction:row;padding:10px 16px;font-size:17px;border-radius:14px;color:var(--soft)}
  .order b{color:var(--accent);font-weight:600}
  .warn{background:#FFF3E3;color:#8A5A1E;border-radius:16px;padding:14px 18px;margin:0 4px 18px;font-size:17px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .cat{height:auto;padding:16px 12px 14px;border-radius:22px;gap:10px}
  .cat img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:12px;background:#fff}
  .cat span{font-size:24px;font-weight:600}
  .cat small{font-size:14px;color:var(--soft)}
  .themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:8vh}
  #themes{grid-template-columns:repeat(3,1fr);margin-top:4vh} #themes .theme{min-height:150px;font-size:30px}
  @media (max-width:700px){ #themes{grid-template-columns:1fr} #themes .theme{min-height:96px;font-size:26px} }
  .theme{min-height:200px;border-radius:28px;font-size:36px;font-weight:700;color:var(--accent);border:3px solid var(--line)}
  .theme:active{border-color:var(--accent)}
  .back{flex-direction:row;gap:6px;padding:10px 16px 10px 10px;font-size:18px;border-radius:14px}
  .back svg{width:24px;height:24px}
  .catHead{display:flex;align-items:center;gap:14px}
  .catHead h1{margin:0;font-size:28px}
  .back,.order,.catHead h1{white-space:nowrap}
  @media (max-width:520px){ .theme{min-height:140px;font-size:30px} .catHead h1{font-size:22px}
    #homeView .homeTop{flex-wrap:wrap} #homeView .order{margin-left:auto} }
  @media (max-width:520px){ .grid{grid-template-columns:1fr 1fr;gap:12px} .cat span{font-size:20px} .brand{font-size:26px} }

  /* ===== 練習畫面 ===== */
  #practiceView,#groupView,#listenView{height:100dvh;display:grid;gap:16px;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;grid-template-areas:"top top" "pic nav" "tools nav"}
  .top{grid-area:top;display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:18px}
  .pic{grid-area:pic;background:var(--card);border-radius:24px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:0;position:relative;overflow:hidden;padding:16px}
  .pic img{flex:1;min-height:0;width:100%;object-fit:contain}
  .hint{min-height:64px;font-size:52px;font-weight:600;letter-spacing:6px;margin-top:6px;text-align:center}
  .hint.sentence{font-size:40px;letter-spacing:2px;line-height:1.3}
  .hint.sentence .blank{color:var(--accent)}
  .feedback{position:absolute;top:12px;right:14px;max-width:45%;background:rgba(255,255,255,.88);padding:6px 12px;border-radius:14px;text-align:right;font-size:30px;font-weight:600;min-height:0}
  .feedback:empty{display:none}
  .feedback.ok{color:var(--ok)} .feedback.retry{color:var(--retry)}
  .heard{display:block;font-size:17px;font-weight:400;color:var(--soft);margin-top:2px}
  .nav{grid-area:nav;display:flex;flex-direction:column;gap:12px;justify-content:center}
  .nav button{width:120px;height:84px;font-size:18px}
  .tools{grid-area:tools;display:flex;justify-content:center;align-items:center;gap:28px}
  .tool{width:120px;height:96px;font-size:18px}
  .mic{width:120px;height:120px;border-radius:60px;background:var(--accent);color:#fff;font-size:18px}
  .mic svg{width:40px;height:40px}
  .mic.listening{background:#C2553F;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,85,63,.35)}50%{box-shadow:0 0 0 16px rgba(194,85,63,0)}}
  @media (max-width:700px) and (orientation:portrait){
    #practiceView,#groupView,#listenView{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto;grid-template-areas:"top" "nav" "pic" "tools";gap:12px}
    .nav{flex-direction:row}
    .nav button{flex:1;width:auto;height:56px;flex-direction:row;font-size:16px}
    .nav button svg{width:22px;height:22px}
    .tools{gap:8px;min-width:0;width:100%} .tool{flex:1 1 0;min-width:0;max-width:96px;height:80px;font-size:14px} .mic{flex:none;width:92px;height:92px}
    .hint{font-size:40px;min-height:50px}
    .hint.sentence{font-size:28px}
  }
  @media (max-height:500px){ .tool{height:72px} .mic{width:88px;height:88px} .nav button{height:64px}
    .hint{font-size:32px;min-height:40px} .hint.sentence{font-size:26px} .feedback{font-size:22px} }
  /* ===== 分類練習 ===== */
  .menuPage{height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
  .secTitle{font-size:18px;color:var(--soft);margin:18px 6px 10px}
  .countRow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .countBtn{height:72px;font-size:26px;font-weight:700;border:3px solid var(--line);border-radius:18px}
  .countBtn.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .catBtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .catBtn{height:72px;font-size:22px;font-weight:600;border:3px solid var(--line);border-radius:18px}
  .catBtn:active{border-color:var(--accent)}
  .soon{text-align:center;color:var(--soft);font-size:22px;margin-top:12vh;line-height:1.8}
  .gTopR{display:flex;align-items:center;gap:12px}
  .levelBtn{flex-direction:row;padding:6px 6px;border-radius:14px;font-size:17px;gap:0}
  .levelBtn span{padding:6px 14px;border-radius:10px;color:var(--soft);white-space:nowrap}
  #gName,#lName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #gProgress,#lProgress{white-space:nowrap}
  #listenView .top{gap:10px}
  #groupView .top{gap:10px}
  .levelBtn span.on{background:var(--accent);color:#fff}
  .gPics{flex:1 1 0;min-height:0;width:100%;display:grid;gap:10px;grid-template-rows:1fr;grid-auto-rows:1fr}
  .gPics .cell{position:relative;min-width:0;min-height:0;overflow:hidden}
  .gPics .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .gPics.n2{grid-template-columns:1fr 1fr} .gPics.n3{grid-template-columns:1fr 1fr 1fr}
  .gPics.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .gPics.n5{grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr}
  .gPics.n5 .cell{grid-column:span 2} .gPics.n5 .cell:nth-child(4){grid-column:2/span 2}
  #gHint{flex:none;position:relative;z-index:1;background:#F3F0EA;border-radius:16px;padding:6px 18px;margin-top:10px}
  #gDone{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;border-radius:24px}
  #gDone h2{font-size:48px;margin:0;color:var(--accent)}
  #gDone p{font-size:22px;color:var(--soft);margin:0}
  #gDone .row{display:flex;gap:16px}
  #gDone button{padding:18px 28px;font-size:22px;border:3px solid var(--line);border-radius:18px}
  @media (max-width:520px){ .levelBtn span{padding:6px 10px} .countBtn{font-size:20px;height:60px} .catBtn{font-size:18px;height:60px} .catBtns{grid-template-columns:1fr 1fr} #gDone h2{font-size:36px} }
  /* ===== 詞彙聽理解 ===== */
  #lPics .cell{cursor:pointer;border-radius:16px;border:4px solid transparent;transition:opacity .2s}
  #lPics .cell.ok{border-color:var(--ok);background:#EEF6F2}
  #lPics .cell.no{opacity:.3}
  #lPics .cell.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  #lHint{flex:none;background:#F3F0EA;border-radius:16px;padding:6px 18px;margin-top:10px;min-height:0}
  #lHint:empty{display:none}
  #listenView .tools{gap:28px}
  @media (max-width:700px) and (orientation:portrait){
    .gPics.n2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .gPics.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
    .gPics.n3 .cell:nth-child(3){grid-column:1/span 2}
    .gPics.n5{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}
    .gPics.n5 .cell{grid-column:auto} .gPics.n5 .cell:nth-child(4){grid-column:auto} .gPics.n5 .cell:nth-child(5){grid-column:1/span 2}
  }
  /* ===== 詞彙讀理解 ===== */
  #readView{height:100dvh;display:grid;gap:16px;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    grid-template-columns:minmax(0,1fr) minmax(180px,26%) auto;grid-template-rows:auto 1fr auto;
    grid-template-areas:"top top top" "pic words nav" "tools tools nav"}
  #readView .pic img{flex:1;min-height:0;width:100%;object-fit:contain}
  #rWords{grid-area:words;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0}
  .wordBtn{flex:0 1 96px;min-height:56px;font-size:34px;font-weight:700;border:3px solid var(--line);border-radius:20px;letter-spacing:2px}
  .wordBtn.long{font-size:24px;letter-spacing:0;line-height:1.3;padding:8px 12px}
  #readView.longWords{grid-template-columns:minmax(0,1fr) minmax(260px,36%) auto}
  .wordBtn.ok{border-color:var(--ok);background:#EEF6F2;color:var(--ok)}
  .wordBtn.no{opacity:.3}
  .wordBtn.shake{animation:shake .35s}
  #rHint:empty{display:none}
  #rHint{flex:none;background:#F3F0EA;border-radius:16px;padding:6px 18px;margin-top:10px}
  #readView .tools{gap:28px}
  #rName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #rProgress{white-space:nowrap}
  @media (max-width:700px) and (orientation:portrait){
    #readView{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"top" "nav" "pic" "words" "tools";gap:12px}
    #readView .nav{flex-direction:row} #readView .nav button{flex:1;width:auto;height:56px;flex-direction:row;font-size:16px}
    #rWords{display:grid;grid-template-columns:1fr 1fr;gap:10px} .wordBtn{font-size:24px;min-height:60px}
    #rWords .wordBtn:last-child:nth-child(odd){grid-column:1/span 2}
    #readView.longWords{grid-template-columns:minmax(0,1fr)} #readView.longWords #rWords{grid-template-columns:1fr} #readView.longWords #rWords .wordBtn{grid-column:auto} #readView.longWords #rHint{font-size:24px} .wordBtn.long{font-size:20px;min-height:48px}
  }
  @media (max-height:500px){ .wordBtn{font-size:24px;min-height:44px} }
</style>
</head>
<body>

<!-- 主頁：選主題 -->
<div id="themeView" class="page">
  <div class="homeTop">
    <div class="brand"><img src="icon-180.png" alt="">顧講話</div>
  </div>
  <div class="warn hidden" id="warn">目前是「主畫面模式」，蘋果系統在這個模式下不允許使用麥克風。<br>請改用 Safari 打開：https://zivweii.github.io/gujianghua/網站檔案/</div>
  <div class="themes" id="themes"></div>
</div>

<!-- 主題內：選類別 -->
<div id="homeView" class="page hidden">
  <div class="homeTop">
    <div class="catHead">
      <button class="back" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>主題</button>
      <h1 id="themeName"></h1>
    </div>
    <button class="order" id="orderBtn">題目順序：<b id="orderLabel">固定</b></button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- 分類練習：選項目 -->
<div id="classView" class="menuPage hidden">
  <div class="homeTop"><div class="catHead">
    <button class="back" id="classBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>主題</button>
    <h1>分類練習</h1></div></div>
  <div class="themes">
    <button class="theme" id="toGroup">同類命名</button>
    <button class="theme" id="toOdd">找不同類</button>
  </div>
</div>

<!-- 同類命名：選張數與類別 -->
<div id="groupSetupView" class="menuPage hidden">
  <div class="homeTop"><div class="catHead">
    <button class="back" id="groupBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>分類練習</button>
    <h1>同類命名</h1></div></div>
  <div class="secTitle">一次出現幾張圖片</div>
  <div class="countRow" id="countRow"></div>
  <div class="secTitle">選一個類別開始練習</div>
  <div class="catBtns" id="groupCats"></div>
</div>

<!-- 找不同類（內容準備中） -->
<div id="oddView" class="menuPage hidden">
  <div class="homeTop"><div class="catHead">
    <button class="back" id="oddBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>分類練習</button>
    <h1>找不同類</h1></div></div>
  <div class="secTitle">一次出現幾張圖片</div>
  <div class="countRow" id="oddCountRow"></div>
  <div class="secTitle">選一個類別開始練習</div>
  <div class="catBtns" id="oddCats"></div>
</div>

<!-- 詞彙聽理解：選張數與類別 -->
<div id="listenSetupView" class="menuPage hidden">
  <div class="homeTop"><div class="catHead">
    <button class="back" id="listenBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>主題</button>
    <h1>詞彙聽理解</h1></div></div>
  <div class="secTitle">一次出現幾張圖片</div>
  <div class="countRow" id="lCountRow"></div>
  <div class="secTitle">選一個類別開始練習</div>
  <div class="catBtns" id="lCats"></div>
</div>

<!-- 詞彙聽理解：練習畫面 -->
<div id="listenView" class="practice hidden">
  <div class="top"><span id="lName"></span>
    <div class="gTopR">
      <button class="levelBtn" id="lLevel"><span data-l="easy">簡單</span><span data-l="hard">困難</span></button>
      <span id="lProgress"></span></div></div>
  <div class="pic">
    <div class="gPics" id="lPics"></div>
    <div class="hint sentence" id="lHint"></div>
    <div class="feedback" id="lFeedback"></div>
    <div id="lDone" class="hidden" style="position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;border-radius:24px">
      <h2 style="font-size:48px;margin:0;color:var(--accent)">恭喜完成！</h2><p id="lDoneText" style="font-size:22px;color:var(--soft);margin:0"></p>
      <div style="display:flex;gap:16px"><button id="lAgain" style="padding:18px 28px;font-size:22px;border:3px solid var(--line);border-radius:18px">再練一次</button><button id="lMenu" style="padding:18px 28px;font-size:22px;border:3px solid var(--line);border-radius:18px">回到選單</button></div></div>
  </div>
  <div class="nav">
    <button id="lPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>上一題</button>
    <button id="lNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>下一題</button>
    <button id="lHome"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>回到主頁</button>
  </div>
  <div class="tools">
    <button class="tool" id="lVoice"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>語音提示</button>
    <button class="tool" id="lText"><svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M12 6v13"/><path d="M8 19h8"/></svg>文字提示</button>
  </div>
</div>

<!-- 詞彙讀理解：選張數與類別 -->
<div id="readSetupView" class="menuPage hidden">
  <div class="homeTop"><div class="catHead">
    <button class="back" id="readBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>主題</button>
    <h1>詞彙讀理解</h1></div></div>
  <div class="secTitle">一次出現幾組文字</div>
  <div class="countRow" id="rCountRow"></div>
  <div class="secTitle">選一個類別開始練習</div>
  <div class="catBtns" id="rCats"></div>
</div>

<!-- 詞彙讀理解：練習畫面 -->
<div id="readView" class="practice hidden">
  <div class="top"><span id="rName"></span><div class="gTopR"><button class="levelBtn hidden" id="rLevel"><span data-l="easy">簡單</span><span data-l="hard">困難</span></button><span id="rProgress"></span></div></div>
  <div class="pic">
    <img id="rPhoto" alt="">
    <div class="hint sentence" id="rHint"></div>
    <div class="feedback" id="rFeedback"></div>
    <div id="rDone" class="hidden" style="position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;border-radius:24px">
      <h2 style="font-size:48px;margin:0;color:var(--accent)">恭喜完成！</h2><p id="rDoneText" style="font-size:22px;color:var(--soft);margin:0"></p>
      <div style="display:flex;gap:16px"><button id="rAgain" style="padding:18px 28px;font-size:22px;border:3px solid var(--line);border-radius:18px">再練一次</button><button id="rMenu" style="padding:18px 28px;font-size:22px;border:3px solid var(--line);border-radius:18px">回到選單</button></div></div>
  </div>
  <div id="rWords"></div>
  <div class="nav">
    <button id="rPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>上一題</button>
    <button id="rNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>下一題</button>
    <button id="rHome"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>回到主頁</button>
  </div>
  <div class="tools">
    <button class="tool" id="rVoice"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>語音提示</button>
    <button class="tool" id="rText"><svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M12 6v13"/><path d="M8 19h8"/></svg>文字提示</button>
  </div>
</div>

<!-- 功能性詞彙聽理解／讀理解：選單 -->
<div id="flSetupView" class="menuPage hidden">

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

// ===== 主頁 =====
let shuffleOn = store.get("shuffle", false);
function renderOrder(){ $("orderLabel").textContent = shuffleOn ? "打亂" : "固定"; }
$("orderBtn").onclick = () => { shuffleOn = !shuffleOn; store.set("shuffle", shuffleOn); renderOrder(); };
renderOrder();

// 主題清單：之後新增主題，只要在這裡加一筆
const THEMES = [
  { id: "naming", name: "詞彙命名", cats: DATA },
  { id: "listen", name: "詞彙聽理解", page: "listenSetupView" },
  { id: "read", name: "詞彙讀理解", page: "readSetupView" },
  { id: "func", name: "功能性詞彙命名", cats: (typeof FUNC_DATA !== "undefined" ? FUNC_DATA : []) },
  { id: "flisten", name: "功能性詞彙聽理解", page: "flSetupView" },
  { id: "fread", name: "功能性詞彙讀理解", page: "frSetupView" },
  { id: "class", name: "分類練習", page: "classView" },
];
let theme = null;
const PAGES = ["themeView","homeView","practiceView","classView","groupSetupView","oddView","groupView","listenSetupView","listenView","readSetupView","readView","flSetupView","frSetupView"];
function showPage(id){ PAGES.forEach(p => $(p).classList.toggle("hidden", p !== id)); }
THEMES.forEach(t => {
  const b = document.createElement("button");
  b.className = "theme"; b.textContent = t.name;
  b.onclick = () => t.page ? showPage(t.page) : openTheme(t);
  $("themes").appendChild(b);
});
function openTheme(t){
  theme = t;
  $("themeName").textContent = t.name;
  $("grid").innerHTML = "";
  t.cats.forEach((cat, ci) => {
    const b = document.createElement("button");
    b.className = "cat";
    b.innerHTML = `<img src="${cat.cover}" alt=""><span>${cat.name}</span><small>${cat.count} 題</small>`;
    b.onclick = () => startCategory(ci);
    $("grid").appendChild(b);
  });
  showPage("homeView");
  $("homeView").scrollTop = 0;
}
$("backBtn").onclick = () => showPage("themeView");

// ===== 練習 =====
let cat, order, pos, voiceStep, textStep;
// 每個類別的照片放在各自的檔案，點進去時才載入
function loadCategory(id){
  return new Promise((ok, fail) => {
    if(window.CAT && window.CAT[id]) return ok();
    const s = document.createElement("script");
    s.src = `data/${id}.js?v=${DATA_V}`; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}
async function startCategory(ci){
  const info = theme.cats[ci];
  try{ await loadCategory(info.id); }catch(e){ alert("載入失敗，請檢查網路後再試一次"); return; }
  cat = { name: info.name, items: window.CAT[info.id] };
  order = cat.items.map((_, i) => i);
  if(shuffleOn) for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  pos = 0;
  $("catName").textContent = cat.name;
  showPage("practiceView");
  show();
}
function item(){ return cat.items[order[pos]]; }
// 要說出的答案：功能性詞彙是「用途」，詞彙命名是「名稱」
function target(it){ return it.answer || it.name; }
// 功能性詞彙的簡單／困難
let fLevel = store.get("fLevel", "easy"), filled = new Set(), voiceIdx = 0;
const isHard = it => fLevel === "hard" && it.prompt && it.hard;
function renderHint(){
  const it = item(), a = target(it), el = $("hint");
  $("fLevel").querySelectorAll("span").forEach(sp => sp.classList.toggle("on", sp.dataset.l === fLevel));
  if(isHard(it)){   // 困難：好幾個空格，說對一個填一個
    const blanks = it.hard.answers.map((w, i) => {
      const t = (filled.has(i) || textStep >= 2) ? w : textStep === 1 ? w[0] + "＿".repeat(w.length-1) : "＿".repeat(Math.max(2, w.length));
      return `<span class="blank">${t}</span>`;
    });
    el.className = "hint sentence";
    el.innerHTML = it.hard.prompt + blanks.join("、") + "。";
  }else if(it.prompt){   // 功能性詞彙：一直顯示句子，空格填答案
    let fill;
    if(textStep === 0) fill = `<span class="blank">${"＿".repeat(a.length)}</span>`;
    else if(textStep === 1) fill = `<span class="blank">${a[0]}${"＿".repeat(a.length-1)}</span>`;
    else fill = `<span class="blank">${a}</span>`;
    el.className = "hint sentence";
    el.innerHTML = it.prompt + fill + "。";
  }else{
    el.className = "hint";
    el.textContent = textStep === 0 ? "" : textStep === 1 ? a[0] + " ＿".repeat(a.length-1) : a;
  }
}
function show(){
  stopListening(); speechSynthesis.cancel();
  voiceStep = textStep = 0; filled = new Set(); voiceIdx = 0;
  $("fLevel").classList.toggle("hidden", !item().hard);
  $("photo").src = item().img;
  renderHint();
  $("readAll").classList.toggle("hidden", !item().prompt);
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  $("progress").textContent = `${pos+1} / ${order.length}`;
  $("prev").disabled = pos === 0;
  $("next").disabled = pos === order.length - 1;
  // 預先載入下一張
  if(pos+1 < order.length){ new Image().src = cat.items[order[pos+1]].img; }
}
$("prev").onclick = () => { if(pos>0){ pos--; show(); } };
$("next").onclick = () => { if(pos<order.length-1){ pos++; show(); } };
$("home").onclick = () => {
  stopListening(); speechSynthesis.cancel();
  showPage("homeView");
};

// ===== 語音提示：第一次唸第一個字，第二次唸完整名稱 =====
function zhVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>v.lang==="zh-TW") || vs.find(v=>/zh[-_]?(TW|Hant)/i.test(v.lang)) || vs.find(v=>v.lang.startsWith("zh"));
}
speechSynthesis.getVoices();
function speak(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW"; u.rate = 0.8;
  const v = zhVoice(); if(v) u.voice = v;
  speechSynthesis.speak(u);
}
// 整句朗讀（功能性詞彙）：唸出完整句子讓病人仿說
$("readAll").onclick = () => { const it = item(); speak(isHard(it) ? it.hard.prompt + it.hard.answers.join("，") : it.prompt + target(it)); };
$("fLevel").onclick = () => {
  fLevel = fLevel === "easy" ? "hard" : "easy"; store.set("fLevel", fLevel);
  voiceStep = textStep = 0; filled = new Set(); voiceIdx = 0; say("", ""); renderHint();
};
$("voiceHint").onclick = () => {
  const it = item();
  if(isHard(it)){   // 困難：按一次唸第一個詞彙，再按唸第二個，以此類推
    const list = it.hard.answers;
    speak(list[voiceIdx % list.length]); voiceIdx++;
    return;
  }
  voiceStep = Math.min(voiceStep+1, 2);
  const n = target(item());
  speak(voiceStep===1 ? n[0] : n);
};

// ===== 文字提示：第一次顯示第一個字，第二次顯示完整名稱 =====
$("textHint").onclick = () => {
  textStep = Math.min(textStep+1, 2);
  renderHint();
};

// ===== 答對提示音 =====
let audioCtx;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    [523.25, 783.99].forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime+i*0.18;
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.9);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+1);
    });
  }catch(e){}
}

// ===== 麥克風語音辨識 =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STANDALONE = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
if(STANDALONE) $("warn").classList.remove("hidden");
let rec = null, listening = false;
const clean = s => s.replace(/[\s，。,.!?！？、；;:：「」]/g,"");
function setListening(on){
  listening = on;
  $("mic").classList.toggle("listening", on);
  $("micLabel").textContent = on ? "聽你說…" : "按我說";
}
function stopListening(){ if(rec){ rec.onresult = rec.onerror = rec.onend = null; try{ rec.abort(); }catch(e){} rec = null; } setListening(false); }
function say(cls, html){ $("feedback").className = "feedback " + cls; $("feedback").innerHTML = html; }
$("mic").onclick = () => {
  if(!SR){ say("retry","這台裝置不支援語音辨識"); return; }
  if(STANDALONE){ say("retry","主畫面模式無法使用麥克風<span class=\"heard\">請改用 Safari 打開</span>"); return; }
  if(listening){ rec && rec.stop(); return; }
  say("", "");
  speechSynthesis.cancel();
  const it = item(), answers = [target(it), ...it.accept].map(clean);
  rec = new SR();
  rec.lang = "zh-TW"; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
  let got = false;
  rec.onresult = e => {
    got = true;
    const alts = [...e.results[0]].map(a=>clean(a.transcript));
    const heard = `<span class="heard">聽到：${alts[0]||""}</span>`;
    if(isHard(it)){
      const list = it.hard.answers.map(clean), before = filled.size;
      list.forEach((w, i) => { if(alts.some(t => t.includes(w))) filled.add(i); });
      renderHint();
      if(filled.size === list.length){ say("ok", "全部答對了！" + heard); chime(); }
      else if(filled.size > before) say("ok", `很好！還有 ${list.length - filled.size} 個` + heard);
      else say("retry", "再試一次" + heard);
      return;
    }
    const rej = (it.reject || []).map(clean);
    const ok = alts.some(t => answers.some(a => t.includes(a)) && !rej.some(r => t.includes(r)));
    if(ok){ say("ok", "答對了！" + heard); chime(); textStep = 2; renderHint(); }
    else say("retry", "再試一次" + heard);
  };
  rec.onerror = e => {
    got = true;
    say("retry", {
      "not-allowed":"請允許使用麥克風",
      "service-not-allowed":"請到「設定 › 一般 › 鍵盤」開啟聽寫",
      "no-speech":"沒有聽到聲音，請再按一次",
      "audio-capture":"找不到麥克風",
      "network":"網路連線有問題"
    }[e.error] || "發生問題，請再按一次");
  };
  rec.onend = () => { setListening(false); if(!got) say("retry","沒有聽到聲音，請再按一次"); };
  try{ rec.start(); setListening(true); }catch(e){ say("retry","無法啟動麥克風"); }
};

<script>

};
const ROUNDS = 20;

// 張數按鈕

$("oddCountRow").style.gridTemplateColumns = "repeat(3,1fr)";
{ const b = document.createElement("button");

DATA.forEach(c => {

// 類別按鈕（詞彙命名的所有類別）
DATA.forEach(c => {

  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

}
async function startGroup(c){

  try{ await Promise.all([loadPool(), ...(c ? [loadCategory(c.id)] : [])]); }
  catch(e){ alert("載入失敗，請檢查網路後再試一次"); return; }
  finally{ if(btn){ btn.textContent = btn.dataset.name; btn.disabled = false; } }
  gMode = "odd";
  const P = window.ODD_POOL, ids = Object.keys(P);
  const k = oddCount - 1;
  const makeRound = sameId => {
    const pool = ids.filter(d => d !== sameId && !(ODD_AVOID[sameId] || []).includes(d));
    const oc = pool[Math.floor(Math.random() * pool.length)];
    const odd = P[oc][Math.floor(Math.random() * P[oc].length)];
    const src = (c && window.CAT && window.CAT[sameId]) ? window.CAT[sameId] : P[sameId];
    const same = pickRandom(src.length, Math.min(k, src.length)).map(i => src[i]);
    const pics = [...same]; pics.splice(Math.floor(Math.random() * (same.length + 1)), 0, odd);
    const w = catWord(sameId);
    return { same, odd, oddCat: catWord(oc), sameCat: w, pics };
  };
  gCat = c ? (() => { const w = catWord(c.id); return { id: c.id, name: c.name, word: w.word, wordAccept: w.accept }; })()
           : { id: null, name: "全部隨機", word: "", wordAccept: [] };
  gRounds = Array.from({length: ROUNDS}, () => makeRound(c ? c.id : ids[Math.floor(Math.random() * ids.length)]));
  gPos = 0;
  $("gName").textContent = `找不同類・${gCat.name}・${["","","","三","四","五"][oddCount]}個`;
  showPage("groupView");
  gShow();
}
function gItems(){ return gMode === "odd" ? gRounds[gPos].same : gRounds[gPos].map(i => gCat.items[i]); }
function gPicsNow(){ return gMode === "odd" ? gRounds[gPos].pics : gItems(); }
// 找不同類的兩個空格：0＝同類的類別，1＝不同類那張的類別
function oddWords(){ const r = gRounds[gPos]; return [{ word: r.sameCat.word, accept: r.sameCat.accept }, { word: r.oddCat.word, accept: r.oddCat.accept }]; }
function oddSentence(fill){ const r = gRounds[gPos]; return `${joinNames(r.same.map(it => it.name))}為${fill[0]}，${r.odd.name}為${fill[1]}`; }
function joinNames(list){ return list.length === 1 ? list[0] : list.slice(0,-1).join("、") + "和" + list[list.length-1]; }
const blank = n => `<span class="blank">${"＿".repeat(Math.max(2, n))}</span>`;
const part = (w, step) => `<span class="blank">${step === 0 ? "＿".repeat(Math.max(2, w.length)) : step === 1 ? w[0] + "＿".repeat(w.length-1) : w}</span>`;

// 句子：簡單＝「蘋果和香蕉為＿＿」；困難＝「＿＿和＿＿為＿＿＿」
// 困難的逐步提示：1 每格第一個字 → 2 物品名稱全部出現 → 3 類別也完整出現
function gRender(){
  const names = gItems().map(it => it.name), w = gCat.word;
  let html;
  $("gLevel").classList.toggle("hidden", gMode === "odd");
  if(gMode === "odd"){
    const f = oddWords().map((o, i) => (oddFilled.has(i) || gTextStep >= 2) ? `<span class="blank">${o.word}</span>` : part(o.word, gTextStep));
    $("gHint").innerHTML = oddSentence(f) + "。";
    return;
  }
  if(gSolved){
    html = `${joinNames(names)}為<span class="blank">${w}</span>`;
  }else if(gLevel === "easy"){
    html = `${joinNames(names)}為${part(w, gTextStep)}`;
  }else{
    const ns = gTextStep === 0 ? 0 : gTextStep === 1 ? 1 : 2;
    const ws = gTextStep <= 1 ? gTextStep : gTextStep === 2 ? 1 : 2;
    html = `${joinNames(names.map(n => part(n, ns)))}為${part(w, ws)}`;
  }
  $("gHint").innerHTML = html + "。";
  $("gLevel").querySelectorAll("span").forEach(sp => sp.classList.toggle("on", sp.dataset.l === gLevel));
}
function gSay(cls, html){ $("gFeedback").className = "feedback " + cls; $("gFeedback").innerHTML = html; }
function gShow(){
  gStopListening(); speechSynthesis.cancel();
  gVoiceStep = gTextStep = 0; gSolved = false; gVoiceIdx = 0; oddFilled = new Set();
  $("gDone").classList.add("hidden");
  const its = gPicsNow();
  $("gPics").className = "gPics n" + its.length;
  $("gPics").innerHTML = its.map(it => `<div class="cell"><img src="${it.img}" alt=""></div>`).join("");
  gSay("", "");
  $("gProgress").textContent = `${gPos+1} / ${ROUNDS}`;
  $("gPrev").disabled = gPos === 0;
  $("gNext").disabled = false;
  gRender();
}
function gFinish(){
  gStopListening(); speechSynthesis.cancel();
  $("gDoneText").textContent = `${gCat.name}・${ROUNDS} 題都練習完了`;
  $("gDone").classList.remove("hidden");
  $("gNext").disabled = true;
  chime();
}
$("gPrev").onclick = () => { if(gPos > 0){ gPos--; gShow(); } };
$("gNext").onclick = () => { if(gPos < ROUNDS-1){ gPos++; gShow(); } else gFinish(); };
const gSetup = () => gMode === "odd" ? "oddView" : "groupSetupView";
$("gHome").onclick = () => { gStopListening(); speechSynthesis.cancel(); showPage(gSetup()); };
$("gAgain").onclick = () => { const c = DATA.find(c => c.id === gCat.id) || null; gMode === "odd" ? startOdd(c) : startGroup(c); };
$("gMenu").onclick = () => showPage(gSetup());
$("gLevel").onclick = () => { gLevel = gLevel === "easy" ? "hard" : "easy"; store.set("gLevel", gLevel); gVoiceStep = gTextStep = 0; gSolved = false; gVoiceIdx = 0; gSay("",""); gRender(); };

// 提示：簡單 2 段，困難 3 段
const maxStep = () => (gMode === "odd" || gLevel === "easy") ? 2 : 3;
$("gText").onclick = () => { gTextStep = Math.min(gTextStep+1, maxStep()); gRender(); };
// 語音提示：簡單＝類別第一字→完整類別；困難＝依序唸每個詞彙（物品名稱…最後是類別），唸完重新開始
let gVoiceIdx = 0;
$("gVoice").onclick = () => {
  if(gMode === "odd"){   // 找不同類：按一次唸第一個詞彙，再按唸第二個，以此類推（循環）
    const list = oddWords().map(o => o.word);
    speak(list[gVoiceIdx % list.length]); gVoiceIdx++; return;
  }
  const names = gItems().map(it => it.name), w = gCat.word;
  if(gLevel === "easy"){ gVoiceStep = Math.min(gVoiceStep+1, 2); speak(gVoiceStep === 1 ? w[0] : w); return; }
  const list = [...names, w];
  speak(list[gVoiceIdx % list.length]); gVoiceIdx++;
};
// 整句朗讀：唸出完整句子讓病人仿說
$("gReadAll").onclick = () => speak(gMode === "odd" ? oddSentence(oddWords().map(o => o.word)) : joinNames(gItems().map(it => it.name)) + "為" + gCat.word);

// 麥克風：簡單＝說出類別；困難＝整句（每個物品名稱＋類別都要說到）
let gRec = null, gListening = false;
function gSetListening(on){ gListening = on; $("gMic").classList.toggle("listening", on); $("gMicLabel").textContent = on ? "聽你說…" : "按我說"; }
function gStopListening(){ if(gRec){ gRec.onresult = gRec.onerror = gRec.onend = null; try{ gRec.abort(); }catch(e){} gRec = null; } gSetListening(false); }
$("gMic").onclick = () => {
  if(!SR){ gSay("retry","這台裝置不支援語音辨識"); return; }
  if(STANDALONE){ gSay("retry","主畫面模式無法使用麥克風<span class=\"heard\">請改用 Safari 打開</span>"); return; }
  if(gListening){ gRec && gRec.stop(); return; }
  gSay("",""); speechSynthesis.cancel();
  const wordAns = [gCat.word, gCat.word + "類", ...gCat.wordAccept].map(clean);
  const itemAns = gItems().map(it => [it.name, ...it.accept].map(clean));
  gRec = new SR();
  gRec.lang = "zh-TW"; gRec.interimResults = false; gRec.maxAlternatives = 5; gRec.continuous = false;
  let got = false;
  gRec.onresult = e => {
    got = true;
    const alts = [...e.results[0]].map(a => clean(a.transcript));
    const has = (t, list) => list.some(a => t.includes(a));
    const heard = `<span class="heard">聽到：${alts[0]||""}</span>`;
    if(gMode === "odd"){   // 說對一個填一個
      const ws = oddWords(), before = oddFilled.size;
      ws.forEach((o, i) => { const l = [o.word, o.word + "類", ...o.accept].map(clean); if(alts.some(t => has(t, l))) oddFilled.add(i); });
      gRender();
      if(oddFilled.size === ws.length){ gSay("ok", "全部答對了！" + heard); chime(); }
      else if(oddFilled.size > before) gSay("ok", "很好！還有 1 個" + heard);
      else gSay("retry", "再試一次" + heard);
      return;
    }
    const ok = alts.some(t => has(t, wordAns) && (gLevel === "easy" || itemAns.every(l => has(t, l))));
    if(ok){ gSay("ok", "答對了！" + heard); chime(); gSolved = true; gRender(); }
    else gSay("retry", "再試一次" + heard);
  };
  gRec.onerror = e => {
    got = true;
    gSay("retry", {"not-allowed":"請允許使用麥克風","service-not-allowed":"請到「設定 › 一般 › 鍵盤」開啟聽寫",
      "no-speech":"沒有聽到聲音，請再按一次","audio-capture":"找不到麥克風","network":"網路連線有問題"}[e.error] || "發生問題，請再按一次");
  };
  gRec.onend = () => { gSetListening(false); if(!got) gSay("retry","沒有聽到聲音，請再按一次"); };
  try{ gRec.start(); gSetListening(true); }catch(e){ gSay("retry","無法啟動麥克風"); }
};

<script>
// ===================== 詞彙聽理解 =====================
// 系統唸出一個詞（簡單）或「＿＿在哪裡？」（困難），病人點對應的圖片
let lCount = store.get("lCount", 2), lLevel = store.get("lLevel", "easy");
let lCat, lRounds, lPos, lTextStep, lDoneRound, lFunc = false;   // lFunc＝功能性詞彙聽理解
$("listenBack").onclick = () => showPage("themeView");

["兩個","三個","四個","五個"].forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "countBtn"; b.textContent = t; b.dataset.n = i + 2;

  $("lCountRow").appendChild(b);
});
function renderLCount(){ [...$("lCountRow").children].forEach(b => b.classList.toggle("on", +b.dataset.n === lCount)); }
renderLCount();
{ const b = document.createElement("button");
  b.className = "catBtn"; b.textContent = "全部隨機"; b.style.borderColor = "var(--accent)"; b.style.color = "var(--accent)";
  b.onclick = () => startListen(null, b);
  $("lCats").appendChild(b); }
DATA.forEach(c => {
  const b = document.createElement("button");
  b.className = "catBtn"; b.textContent = c.name;
  b.onclick = () => startListen(c, b);
  $("lCats").appendChild(b);
});

// iPad 規定：要先在使用者按下按鈕時發一次聲音，之後才能自動播放
function unlockSpeech(){ try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }catch(e){} }

// c＝選的類別；null＝全部隨機（每張圖來自不同類別）
async function startListen(c, btn){
  unlockSpeech();
  if(btn){ btn.dataset.name = btn.dataset.name || btn.textContent; btn.textContent = "載入中…"; btn.disabled = true; }
  try{ await (c ? loadCategory(c.id) : loadPool()); }
  catch(e){ alert("載入失敗，請檢查網路後再試一次"); return; }
  finally{ if(btn){ btn.textContent = btn.dataset.name; btn.disabled = false; } }
  lFunc = false;
  lCat = c ? { id: c.id, name: c.name } : { id: null, name: "全部隨機" };
  const makeRound = () => {
    let pics;
    if(c){
      const items = window.CAT[c.id];
      pics = pickRandom(items.length, Math.min(lCount, items.length)).map(i => items[i]);
    }else{
      const P = window.ODD_POOL, ids = Object.keys(P), used = new Set();
      pics = pickRandom(ids.length, Math.min(lCount, ids.length)).map(i => P[ids[i]])
        .map(list => { let it; do{ it = list[Math.floor(Math.random()*list.length)]; }while(used.has(it.name) && list.length > 1); used.add(it.name); return it; });
    }
    return { pics, target: Math.floor(Math.random() * pics.length) };
  };
  lRounds = Array.from({length: ROUNDS}, makeRound);
  lPos = 0;
  $("lName").textContent = `詞彙聽理解・${lCat.name}・${["","","兩","三","四","五"][lCount]}個`;
  showPage("listenView");
  lShow();
}
const lTarget = () => lRounds[lPos].pics[lRounds[lPos].target];
const lPrompt = () => lFunc
  ? (lLevel === "hard" ? `什麼東西可以用來${lTarget().answer}的？` : `可以${lTarget().answer}的`)
  : (lLevel === "hard" ? lTarget().name + "在哪裡？" : lTarget().name);
function lSay(cls, html){ $("lFeedback").className = "feedback " + cls; $("lFeedback").innerHTML = html; }
function lRenderHint(){
  $("lLevel").querySelectorAll("span").forEach(sp => sp.classList.toggle("on", sp.dataset.l === lLevel));
  const w = lTarget().name;
  if(lTextStep === 0 && !lDoneRound){ $("lHint").innerHTML = ""; return; }
  if(lFunc){   // 功能性：文字提示一次就顯示整句
    $("lHint").innerHTML = lDoneRound ? `${lPrompt()}<br><span class="blank">${w}</span>` : lPrompt();
    return;
  }
  const t = (lTextStep >= 2 || lDoneRound) ? w : w[0] + "＿".repeat(w.length - 1);
  $("lHint").innerHTML = `<span class="blank">${t}</span>` + (lLevel === "hard" ? "在哪裡？" : "");
}
function lShow(){
  speechSynthesis.cancel();
  lTextStep = 0; lDoneRound = false;
  $("lDone").classList.add("hidden");
  const r = lRounds[lPos];
  $("lPics").className = "gPics n" + r.pics.length;
  $("lPics").innerHTML = r.pics.map((it, i) => `<div class="cell" data-i="${i}"><img src="${it.img}" alt=""></div>`).join("");
  [...$("lPics").children].forEach(cell => cell.onclick = () => lPick(+cell.dataset.i, cell));
  lSay("", "");
  $("lProgress").textContent = `${lPos+1} / ${ROUNDS}`;
  $("lPrev").disabled = lPos === 0;
  $("lNext").disabled = false;
  lRenderHint();
  setTimeout(() => speak(lPrompt()), 300);   // 進入題目自動播放
}
function lPick(i, cell){
  if(lDoneRound) return;
  if(i === lRounds[lPos].target){
    lDoneRound = true; cell.classList.add("ok");
    [...$("lPics").children].forEach(c => { if(c !== cell) c.classList.add("no"); });
    lSay("ok", "答對了！"); chime(); lRenderHint();
  }else{
    cell.classList.remove("shake"); void cell.offsetWidth; cell.classList.add("shake");
    lSay("retry", "再試一次");
  }
}
function lFinish(){
  speechSynthesis.cancel();
  $("lDoneText").textContent = `${lCat.name}・${ROUNDS} 題都練習完了`;
  $("lDone").classList.remove("hidden");
  $("lNext").disabled = true;
  chime();
}
$("lPrev").onclick = () => { if(lPos > 0){ lPos--; lShow(); } };
$("lNext").onclick = () => { if(lPos < ROUNDS-1){ lPos++; lShow(); } else lFinish(); };
$("lHome").onclick = () => { speechSynthesis.cancel(); showPage(lFunc ? "flSetupView" : "listenSetupView"); };
$("lMenu").onclick = () => showPage(lFunc ? "flSetupView" : "listenSetupView");
$("lAgain").onclick = () => lFunc ? startFunc("l", lCat.id ? FUNC_DATA.find(c => c.id === lCat.id) : null) : startListen(lCat.id ? DATA.find(c => c.id === lCat.id) : null);
$("lLevel").onclick = () => { lLevel = lLevel === "easy" ? "hard" : "easy"; store.set("lLevel", lLevel); lRenderHint(); speak(lPrompt()); };
$("lVoice").onclick = () => speak(lPrompt());   // 再唸一次題目
$("lText").onclick = () => { lTextStep = lFunc ? 2 : Math.min(lTextStep + 1, 2); lRenderHint(); };
</script>

  chime();
}
$("rPrev").onclick = () => { if(rPos > 0){ rPos--; rShow(); } };
$("rNext").onclick = () => { if(rPos < ROUNDS-1){ rPos++; rShow(); } else rFinish(); };
$("rHome").onclick = () => { speechSynthesis.cancel(); showPage(rFunc ? "frSetupView" : "readSetupView"); };
$("rMenu").onclick = () => showPage(rFunc ? "frSetupView" : "readSetupView");
$("rAgain").onclick = () => rFunc ? startFunc("r", rCat.id ? FUNC_DATA.find(c => c.id === rCat.id) : null) : startRead(rCat.id ? DATA.find(c => c.id === rCat.id) : null);
$("rLevel").onclick = () => { rLevel = rLevel === "easy" ? "hard" : "easy"; store.set("rLevel", rLevel); rShow(); };
$("rVoice").onclick = () => speak(rLabel(rTarget()));   // 唸出題目
$("rText").onclick = () => { rTextStep = Math.min(rTextStep + 1, 2); rRenderHint(); };
</script>
<script>
// ===================== 功能性詞彙聽理解／讀理解 =====================
// 共用「詞彙聽理解」「詞彙讀理解」的練習畫面，只是題目改成用途（可以＿＿）
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => showPage("themeView"));
let flCount = store.get("flCount", 2), frCount = store.get("frCount", 2);
function buildFuncMenu(kind){
  const row = $(kind + "CountRow"), cats = $(kind + "Cats");
  const get = () => kind === "fl" ? flCount : frCount;
  ["兩個","三個","四個","五個"].forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "countBtn"; b.textContent = t; b.dataset.n = i + 2;
    b.onclick = () => { if(kind === "fl"){ flCount = i + 2; store.set("flCount", flCount); } else { frCount = i + 2; store.set("frCount", frCount); } render(); };
    row.appendChild(b);
  });
  const render = () => [...row.children].forEach(b => b.classList.toggle("on", +b.dataset.n === get()));
  render();
  const add = (label, c, accent) => {
    const b = document.createElement("button");
    b.className = "catBtn"; b.textContent = label;
    if(accent){ b.style.borderColor = "var(--accent)"; b.style.color = "var(--accent)"; }
    b.onclick = () => startFunc(kind === "fl" ? "l" : "r", c, b);
    cats.appendChild(b);
  };
  add("全部隨機", null, true);
  (typeof FUNC_DATA !== "undefined" ? FUNC_DATA : []).forEach(c => add(c.name, c));
}
buildFuncMenu("fl"); buildFuncMenu("fr");

function loadFuncPool(){
  return new Promise((ok, fail) => {
    if(window.FUNC_POOL) return ok();
    const sc = document.createElement("script");
    sc.src = `data/func_pool.js?v=${DATA_V}`; sc.onload = ok; sc.onerror = fail;
    document.head.appendChild(sc);
  });
}
// 兩個物品的用途有重疊（例如牙刷、牙膏都可以刷牙）就不放在同一題
const useSet = it => new Set([it.answer, ...(it.accept || [])]);
const clash = (a, b) => { const A = useSet(a); return [...useSet(b)].some(x => A.has(x)); };
function pickDistinct(list, k){
  for(let tries = 0; tries < 200; tries++){
    const pick = pickRandom(list.length, Math.min(k, list.length)).map(i => list[i]);
    if(pick.every((x, i) => pick.every((y, j) => i === j || !clash(x, y)))) return pick;
  }
  return pickRandom(list.length, Math.min(k, list.length)).map(i => list[i]);
}
// mode："l"＝聽理解、"r"＝讀理解；c＝類別（null＝全部隨機）
async function startFunc(mode, c, btn){
  unlockSpeech();
  if(btn){ btn.dataset.name = btn.dataset.name || btn.textContent; btn.textContent = "載入中…"; btn.disabled = true; }
  try{ await (c ? loadCategory(c.id) : loadFuncPool()); }
  catch(e){ alert("載入失敗，請檢查網路後再試一次"); return; }
  finally{ if(btn){ btn.textContent = btn.dataset.name; btn.disabled = false; } }
  const list = c ? window.CAT[c.id] : Object.values(window.FUNC_POOL).flat();
  const k = mode === "l" ? flCount : frCount;
  const rounds = Array.from({length: ROUNDS}, () => { const items = pickDistinct(list, k); return { items, target: Math.floor(Math.random() * items.length) }; });
  const cat = c ? { id: c.id, name: c.name } : { id: null, name: "全部隨機" };
  const n = ["","","兩","三","四","五"][k];
  if(mode === "l"){
    lFunc = true; lCat = cat; lPos = 0;
    lRounds = rounds.map(r => ({ pics: r.items, target: r.target }));
    $("lName").textContent = `功能性詞彙聽理解・${cat.name}・${n}個`;
    showPage("listenView"); lShow();
  }else{
    rFunc = true; rCat = cat; rPos = 0;
    rRounds = rounds.map(r => ({ opts: r.items, target: r.target }));
    $("rName").textContent = `功能性詞彙讀理解・${cat.name}・${n}個`;
    showPage("readView"); rShow();
  }
}
</script>
</body>
